name: Design
description: Work out how something should look or behave before it is built
labels:
- type:design
body:
- type: textarea
  id: why
  attributes:
    label: Why
    description: "The value: what it achieves, for whom, and why now. A reader who knows nothing else should get it."
  validations:
    required: true
- type: textarea
  id: context
  attributes:
    label: Context
    description: "What a newcomer needs to know first: where this lives, what exists today, and what related issues or decisions say (in your own words, the reference in brackets)."
  validations:
    required: true
- type: textarea
  id: what
  attributes:
    label: What
    description: What has to be done or decided, in plain words.
  validations:
    required: true
- type: textarea
  id: constraints
  attributes:
    label: Constraints
    description: What the design must respect.
- type: textarea
  id: options
  attributes:
    label: Options
    description: The directions considered so far.
- type: textarea
  id: design_docs
  attributes:
    label: Design docs
    description: Paths in the repository or links, one per line.
    placeholder: docs/design/sync.md
- type: dropdown
  id: priority
  attributes:
    label: Priority
    description: P1 is the most urgent.
    options:
    - P1
    - P2
    - P3
    default: 1
- type: input
  id: role
  attributes:
    label: Role
    description: The role that does it.
- type: dropdown
  id: size
  attributes:
    label: Size
    description: A rough size.
    options:
    - XS
    - S
    - M
    - L
    - XL
