name: Decision
description: A question someone has to decide
labels:
- type:decision
body:
- type: markdown
  attributes:
    value: "A decision issue opens as needs-decision. Record the answer with `plan-me decide \"<text>\" --title \"<title>\" --by \"<who>\" --question <this issue>`: the pull request that adds the decision file closes this issue."
- type: textarea
  id: why
  attributes:
    label: Why
    description: "The value: what it achieves, for whom, and why now. A reader who knows nothing else should get it."
  validations:
    required: true
- type: textarea
  id: context
  attributes:
    label: Context
    description: "What a newcomer needs to know first: where this lives, what exists today, and what related issues or decisions say (in your own words, the reference in brackets)."
  validations:
    required: true
- type: textarea
  id: what
  attributes:
    label: What
    description: What has to be done or decided, in plain words.
  validations:
    required: true
- type: textarea
  id: options
  attributes:
    label: Options
    description: The options, with their pros and cons.
    placeholder: |-
      1. ...
      2. ...
  validations:
    required: true
- type: input
  id: who_decides
  attributes:
    label: Who decides
    description: The person or role who decides.
  validations:
    required: true
- type: dropdown
  id: priority
  attributes:
    label: Priority
    description: P1 is the most urgent.
    options:
    - P1
    - P2
    - P3
    default: 1
- type: input
  id: role
  attributes:
    label: Role
    description: The role that does it.
- type: dropdown
  id: size
  attributes:
    label: Size
    description: A rough size.
    options:
    - XS
    - S
    - M
    - L
    - XL
