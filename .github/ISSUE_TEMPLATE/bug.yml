name: Bug
description: Something does not work as it should
type: Bug
body:
- type: textarea
  id: context
  attributes:
    label: Context
    description: "Where and when it happens: the version or build, the platform, the situation."
  validations:
    required: true
- type: textarea
  id: steps_to_reproduce
  attributes:
    label: Steps to reproduce
    placeholder: |-
      1. ...
      2. ...
      3. ...
  validations:
    required: true
- type: textarea
  id: observed_behavior
  attributes:
    label: Observed behavior
    description: What happens.
  validations:
    required: true
- type: textarea
  id: expected_behavior
  attributes:
    label: Expected behavior
    description: What should happen.
  validations:
    required: true
- type: textarea
  id: additional_context
  attributes:
    label: Additional context
    description: "Logs, screenshots, recordings: paste or drag them here."
  validations:
    required: true
- type: dropdown
  id: priority
  attributes:
    label: Priority
    description: P1 is the most urgent.
    options:
    - P1
    - P2
    - P3
    default: 1
- type: input
  id: role
  attributes:
    label: Role
    description: The role that does it.
- type: dropdown
  id: size
  attributes:
    label: Size
    description: A rough size.
    options:
    - XS
    - S
    - M
    - L
    - XL
