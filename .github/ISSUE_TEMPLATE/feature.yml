name: Feature
description: A new capability, or a change to one
type: Feature
body:
- type: textarea
  id: context
  attributes:
    label: Context
    description: The situation today, and who it concerns.
  validations:
    required: true
- type: textarea
  id: problem
  attributes:
    label: Problem
    description: What is missing or hard today.
  validations:
    required: true
- type: textarea
  id: expected_value
  attributes:
    label: Expected value
    description: What it brings, for whom, and why it is worth doing.
  validations:
    required: true
- type: textarea
  id: acceptance_criteria
  attributes:
    label: Acceptance criteria
    description: Checkable, a list.
    placeholder: "- [ ] ..."
  validations:
    required: true
- type: textarea
  id: design_docs
  attributes:
    label: Design docs
    description: Paths in the repository or links, one per line.
    placeholder: docs/design/sync.md
- type: dropdown
  id: priority
  attributes:
    label: Priority
    description: P1 is the most urgent.
    options:
    - P1
    - P2
    - P3
    default: 1
- type: input
  id: role
  attributes:
    label: Role
    description: The role that does it.
- type: dropdown
  id: size
  attributes:
    label: Size
    description: A rough size.
    options:
    - XS
    - S
    - M
    - L
    - XL
